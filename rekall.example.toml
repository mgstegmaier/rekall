# Rekall settings. Copy to rekall.toml (gitignored) and edit. Secrets go in .env, not here.

[user]
name = "Your Name"            # how the wiki and digests refer to you
timezone = "America/Chicago"  # IANA name; meeting notes are dated in this zone

[vault]
# The folder that holds wiki/ (session digests land in wiki/sessions/). An Obsidian vault if you have one,
# otherwise any folder; setup copies vault-template/ into it.
path = "~/rekall-vault"

[data]
# Index (rag.db), embedding model, distillates, digest staging. Regenerable, kept out of the vault.
path = "~/rekall-data"
# Pipeline state, lint state, locks and logs. Default is fine unless you run two installs on one machine.
# state = "~/.config/rekall"

[wiki]
# Folder under wiki/ that the lifecycle job (scripts/wiki-cleanup.py) moves `status: archive`
# files into. Out of the index, lint and search; wikilinks to them keep resolving.
archive = "archive"

[index]
# fastembed model for the meaning leg. Default is the pinned local model in fetch_model.sh;
# "BAAI/bge-base-en-v1.5" is a larger, more accurate alternative (slower to embed, downloaded
# and cached by fastembed on first use). Changing this requires build_index.py --full.
embedding_model = "BAAI/bge-small-en-v1.5"

[monday]
# Optional. Only used when MONDAY_API_TOKEN is available (environment, keychain, or .env).
board = 0
group = "Auto-Capture"

[secrets]
# Optional. Keys live in the OS keychain by default (the settings page saves them there). To use a
# secrets manager instead, put its command here; the launchers run each job under it.
# run_prefix = "doppler run --project myproject --config dev --"

[graph]
# Optional. Reads your mail and the Teams chats you pick, and writes new project facts and
# decisions into matching wiki project pages. Off unless enabled = true and the MSGRAPH_*
# secrets are saved. scripts/setup-server.py signs you in and writes this section for you.
enabled = false
mail_folders = ["inbox", "sentitems"]
# Only these chats are read. Pick them on the setup page.
chats = []
